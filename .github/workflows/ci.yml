name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t dbahn-delay-api .

  # Auto-deploy: only on push to main, only after checks AND docker are green.
  # Requires two repo secrets (set once):
  #   COOLIFY_WEBHOOK - the app's Deploy Webhook URL (Coolify -> app -> Webhooks)
  #   COOLIFY_TOKEN   - a Coolify API token with deploy permission
  deploy:
    runs-on: ubuntu-latest
    needs: [checks, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify redeploy
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then
            echo "::warning::COOLIFY_WEBHOOK/COOLIFY_TOKEN secrets not set - skipping deploy"
            exit 0
          fi
          curl --fail-with-body -sS -X GET "$WEBHOOK" -H "Authorization: Bearer $TOKEN"
          echo "deploy triggered"
